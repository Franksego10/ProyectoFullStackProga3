<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Dominico</title>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script> <!--(CDN -> Content Delivery Network) Importo el script de conversor PDF -->
    <script>
        // se fija en el local storage si el tema guardado es dark, si no existe no lo ejecuta, lo mismo si es dark
        if (localStorage.getItem('tema') === 'dark') {
            // el añade la clase dark-mode si es que en el local se encontro que el tema era dark
            document.documentElement.classList.add('dark-mode');
            
        }
    </script>
    <link rel="shortcut icon" href="assets/images/libreriaDominicoIcono.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/colores.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/head.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/carrito.css">

</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="assets/images/libreriaDominicoIcono.png" alt="Logo Librería Dominico">
            </a>
        </div>
        <button id="btn-tema"><span id="icono-dark">🌙</span><span id="texto-tema">MODO OSCURO</span></button>
        <div id="saludo-usuario"></div>

        <div class="carrito">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>

            <span id="contador-carrito">0</span>
        </div>
    </header>

    <div class="titulo-pagina">
        <h1>Librería Dominico</h1>
        <p>📚 Libros y Cómics para todos 💥</p>
    </div>

    <main>
        <!-- <h2 class="titulo-contenedor-productos">Nuestros productos</h2> -->
        <!-- <div class="contenedor-productos">
            <span>No hay comics por el momento...</span>
        </div>

        <div id="contenedor-productos">
            <p>Cargando productos...</p>
        </div> -->

        <h2 class="titulo-contenedor-productos"> Comics </h2>
        <div class="contenedor-productos" id="seccion-comics">
            <span>Cargando comics...</span>
        </div>

        <h2 class="titulo-contenedor-productos"> Libros </h2>
        <div class="contenedor-productos" id="seccion-libros">
            <span>Cargando libros...</span>
        </div>

        <div id="items-carrito"></div>
    </main>

    <script src="js/carrito.js"></script>

    <script>
        
        const btnTema = document.getElementById("btn-tema");
        const iconoTema = document.getElementById("icono-dark");
        const textoTema = document.getElementById("texto-tema");

        btnTema.addEventListener("click", () => {
            // cambiamos la clase de html a modo oscuro, si ya lo tiene se lo quita
            document.documentElement.classList.toggle("dark-mode");
            // preguntamos si html contiene la class dark mode
            const esDark = document.documentElement.classList.contains('dark-mode');
            // si tiene lo guarda en "tema" el valor "dark" en el local storage, sino "light"
            if (esDark){
                // textContent interpreta texto plano, innerHTML contenido html
                iconoTema.textContent = "☀️";
                // se fija el ultimo hijo
                textoTema.textContent = "MODO CLARO";
            }else{
                // textContent interpreta texto plano, innerHTML contenido html
                iconoTema.textContent = "🌙";
                // se fija el ultimo hijo
                textoTema.textContent = "MODO OSCURO";
            }
            localStorage.setItem('tema', esDark ? 'dark' : 'light');

        })

        // Al cargar la página, sincroniza el botón con el tema guardado
        if (localStorage.getItem('tema') === 'dark') {
            iconoTema.textContent = "☀️";
            textoTema.textContent = "MODO CLARO";
        }
        
        const nombreUsuario = sessionStorage.getItem("cliente-nombre");
        saludarUsuario(nombreUsuario);
        if(!nombreUsuario){
            window.location.href = "bienvenida.html";
        }

        
        // Saludar usuario/////////////////////////////////
        function saludarUsuario(nombreUsuario) {
            let saludoUsuario = document.getElementById("saludo-usuario");
            saludoUsuario.innerHTML = `<h2>Bienvenidx ${nombreUsuario}!<h2/>`;
        }



        //const contenedorProductos = document.getElementById("contenedor-productos");
        const seccionComics = document.getElementById("seccion-comics");
        const seccionLibros = document.getElementById("seccion-libros");

        const url = "http://localhost:3002/productos/activos";

        async function obtenerProductos() {
            try {
                const response = await fetch(url)
                console.log(response);

                if(!response.ok){
                    // traemos el message que nos devuelve el error 404
                    const parsedResponse = await response.json()
                    throw new Error(`${parsedResponse.message}`)
                }
                const { payload } = await response.json()
                let misComics = payload.filter((producto) => producto.categoria == "comic")
                renderizarProductos(seccionComics, misComics)
                
                let misLibros = payload.filter((producto) => producto.categoria == "libro")
                renderizarProductos(seccionLibros, misLibros)
            } catch (error) {
                console.log(error)
                mostrarError(error)
            }
            
        }

        function renderizarProductos(contenedor, array) {
            
            let htmlProductos = "";

            array.forEach(producto => {
                htmlProductos += `
                    <div class="card-producto">
                        <img src="${producto.pathImagen}" alt="${producto.nombre}">
                        <h4>${producto.nombre}</h4>
                        <p>${producto.descripcion}</p>
                        <span>$${producto.precio}</span>
                        <button class="btn-comprar" data-producto='${JSON.stringify(producto)}'>Comprar</button>
                    </div>
                `;
            });

            contenedor.innerHTML = htmlProductos;

            contenedor.querySelectorAll(".btn-comprar").forEach(btn => {
                btn.addEventListener("click", () => {
                    const producto = JSON.parse(btn.dataset.producto);
                    agregarProductoCarrito(producto);
                });
            });
        }

        function mostrarError(mensaje) {
            contenedorProductos.innerHTML = `
                <p class="mensaje mensaje-error">${mensaje}</p>
            `;
        }

        obtenerProductos();
    </script>
</body>
</html>
